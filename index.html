<style>
:root{
  --bg:#f3f1f7; --paper:#ffffff; --paper2:#f6f3fb; --ink:#231b33; --muted:#6c6480; --rule:#e5e0ee;
  --pen:#5b2fa0; --pen-soft:#eee7f9; --head:#2a1550; --on-head:#f5f0fd; --on-pen:#ffffff;
  --bad:#c4472b; --bad-bg:#fbe6e0; --mid:#b07d0a; --mid-bg:#f8eed2; --good:#13896f; --good-bg:#dcf2ec;
  --gen:#13896f; --stroke:#5b2fa0; --hh:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141019; --paper:#1d1726; --paper2:#251e30; --ink:#ede7f6; --muted:#a69db8; --rule:#342b44;
  --pen:#b697f2; --pen-soft:#2d2242; --head:#1b0f30; --on-head:#efe8fb; --on-pen:#160c27;
  --bad:#f08a6f; --bad-bg:#3b1f19; --mid:#e8bb52; --mid-bg:#352a10; --good:#4fd1ae; --good-bg:#12302a;
  --gen:#4fd1ae; --stroke:#b697f2;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 'Anuphan',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* ── header: แถบม่วงพร้อมเส้นคลื่นสมอง ── */
header.top{position:sticky;top:0;z-index:20;background:var(--head);color:var(--on-head);padding-top:env(safe-area-inset-top,0px);overflow:hidden}
header.top .wrap{position:relative;display:flex;align-items:center;gap:12px;height:var(--hh)}
header.top .eeg{position:absolute;right:-10px;top:0;height:100%;width:260px;opacity:.28;pointer-events:none}
header.top h1{position:relative;font-size:17px;font-weight:600;margin:0;flex:1;line-height:1.2;letter-spacing:.1px}
header.top h1 small{display:block;font-weight:400;opacity:.7;font-size:12.5px;margin-top:2px}
.adm{display:inline-block;vertical-align:2px;font-size:10px;font-weight:700;letter-spacing:.8px;padding:2px 7px;border-radius:6px;background:#f5c451;color:#2a1550;margin-left:4px}
body.is-admin header.top{background:#1c0f36;box-shadow:inset 0 -3px 0 #f5c451}
.net{position:relative;display:flex;align-items:center;gap:6px;font-size:12px;background:rgba(255,255,255,.1);border:0;color:inherit;padding:5px 10px;border-radius:999px}
.net i{width:8px;height:8px;border-radius:50%;background:#a39cb3;display:inline-block}
.net.ok i{background:#5be3b4;box-shadow:0 0 0 3px rgba(91,227,180,.2)}.net.bad i{background:#ff7a66}.net.wait i{background:#f5cf55}

/* ── แถบเมนูล่าง ── */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .wrap{display:flex}
nav.bottom button{flex:1;background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted)}
nav.bottom svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button.on{color:var(--pen);font-weight:600}
nav.bottom button.on svg{background:var(--pen-soft);border-radius:999px;padding:2px 14px;width:54px;height:28px}

main{padding:18px 0 calc(110px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--paper);border-radius:18px;margin-bottom:14px;overflow:hidden}
.sheet>h2{margin:0;padding:16px 16px 6px;font-size:16px;font-weight:600}
.sheet>h2 span{font-weight:400;color:var(--muted);font-size:13px;margin-left:4px}
.pad{padding:12px 16px 16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input.t,select.t,textarea.t{width:100%;padding:11px 14px;border:1.5px solid var(--rule);border-radius:12px;background:var(--paper2);font-size:16px}
input.t:focus,select.t:focus,textarea.t:focus{border-color:var(--pen);outline:none;background:var(--paper)}
textarea.t{min-height:110px;resize:vertical}
.btn{border:1.5px solid var(--rule);background:var(--paper);border-radius:12px;padding:9px 15px;font-size:14px;font-weight:500}
.btn.pri{background:var(--pen);border-color:var(--pen);color:var(--on-pen);font-weight:600}
.btn.ghost{background:none;border-color:transparent;color:var(--pen)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--rule);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:14px}
.chip.on{border-color:var(--pen);background:var(--pen);color:var(--on-pen);font-weight:600}
.svc{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 9px;border-radius:999px;color:#fff}
.svc.STROKE{background:var(--stroke)}.svc.GEN{background:var(--gen)}
@media (prefers-color-scheme:dark){.svc{color:#160c27}}
.banner{background:var(--mid-bg);color:var(--mid);border-radius:14px;padding:11px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ── login ── */
.login{min-height:100dvh;background:var(--head);color:var(--on-head);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 20px);text-align:center;position:relative;overflow:hidden}
.login .eeg{width:min(420px,100%);height:70px;margin-bottom:8px}
.login .eeg.anim path{stroke-dasharray:900;stroke-dashoffset:900;animation:trace 1.6s ease-out .2s forwards}
@keyframes trace{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.login .eeg.anim path{animation:none;stroke-dashoffset:0}}
.login h1{font-size:24px;line-height:1.3;margin:4px 0 4px;font-weight:600}
.login .en{opacity:.65;font-size:14px;margin:0 0 28px}
.dots{display:flex;gap:14px;justify-content:center;margin-bottom:8px}
.dots span{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.18);transition:transform .15s}
.dots span.f{background:#c9b2f7;transform:scale(1.15)}
.err{color:#ffb4a4;min-height:24px;font-size:14px;margin:6px 0 14px}
.keypad{display:grid;grid-template-columns:repeat(3,78px);gap:14px;justify-content:center}
.keypad button{height:78px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:var(--on-head);font-size:28px;font-weight:300}
.keypad button.x{background:none;font-size:15px;opacity:.75}
.keypad button:active{background:rgba(255,255,255,.22)}
.apibox{margin-top:24px;width:100%;max-width:380px;text-align:left}
.apibox summary{opacity:.7;font-size:13px;cursor:pointer;text-align:center}
.apibox label.f{color:var(--on-head);opacity:.7}
.apibox input.t{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:var(--on-head)}

/* ── รายชื่อ ── */
.res{display:flex;gap:14px;align-items:center;padding:14px 16px;border:0;border-top:1px solid var(--rule);background:none;width:100%;text-align:left}
.sheet .res:first-child{border-top:0}
.av{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:20px;font-weight:600;color:#fff}
.av.STROKE{background:var(--stroke)}.av.GEN{background:var(--gen)}
@media (prefers-color-scheme:dark){.av{color:#160c27}}
.res .nm{font-weight:600;font-size:16px}
.res .meta{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.res .go{width:34px;height:34px;border-radius:50%;background:var(--pen-soft);color:var(--pen);display:grid;place-items:center;font-size:18px;flex:none}
.tag{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--good-bg);color:var(--good);font-weight:600}
.tag.d{background:var(--mid-bg);color:var(--mid)}

/* ── แบบประเมิน ── */
.who{background:var(--paper);border-radius:18px;padding:16px;margin-bottom:12px}
.who .nm{font-size:21px;font-weight:600;line-height:1.25}
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 16px;margin:0 -16px 6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));background:var(--bg);z-index:10}
.step{display:flex;align-items:center;gap:7px;border:0;background:var(--paper);border-radius:999px;padding:5px 13px 5px 5px;white-space:nowrap;font-size:13px;color:var(--muted)}
.step span{width:24px;height:24px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;font-size:12px;font-weight:700}
.step.done span{background:var(--good);color:#fff}
.step.on{background:var(--pen);color:var(--on-pen);font-weight:600}
.step.on span{background:rgba(255,255,255,.25);color:inherit}
.sechead{padding:4px 2px 10px}
.sechead h2{margin:0;font-size:22px;font-weight:600;line-height:1.25}
.sechead p{margin:0;color:var(--muted);font-size:14px}
.item{background:var(--paper);border-radius:18px;padding:14px 14px 12px;margin-bottom:10px;border:2px solid transparent}
.item.miss{border-color:var(--bad)}
.q{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qn{flex:none;width:26px;height:26px;border-radius:8px;background:var(--pen-soft);color:var(--pen);font-size:13px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.q .tx{flex:1;font-size:15.5px;font-weight:500;line-height:1.4}
.q .tx small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.val{flex:none;min-width:58px;text-align:right;font-size:26px;font-weight:700;line-height:1;color:var(--rule)}
.val small{display:block;font-size:10.5px;font-weight:500;margin-top:3px;letter-spacing:-.1px;white-space:nowrap}
.val.b1{color:var(--bad)}.val.b2{color:var(--mid)}.val.b3{color:var(--good)}.val.na{color:var(--muted);font-size:18px}
/* เกจคะแนน 1–9 แบ่ง 3 ช่วง */
.gauge,.gl{display:grid;grid-template-columns:repeat(3,1fr) 6px repeat(3,1fr) 6px repeat(3,1fr);column-gap:3px}
.seg{height:40px;border:0;background:var(--paper2);font-size:14px;color:var(--muted);padding:0;transition:background .12s}
.seg:nth-child(4){grid-column:5}.seg:nth-child(7){grid-column:9}
.seg:nth-child(3n+1){border-radius:12px 4px 4px 12px}.seg:nth-child(3n){border-radius:4px 12px 12px 4px}
.seg.f{color:#fff}
.seg.f.b1{background:var(--bad)}.seg.f.b2{background:var(--mid)}.seg.f.b3{background:var(--good)}
@media (prefers-color-scheme:dark){.seg.f{color:#160c27}}
.seg.cur{font-weight:700;font-size:16px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.gfoot{display:flex;align-items:center;gap:10px;margin-top:6px}
.gl{flex:1;font-size:10.5px;letter-spacing:-.1px;color:var(--muted);text-align:center}
.gl .l1{grid-column:1/4}.gl .l2{grid-column:5/8}.gl .l3{grid-column:9/12}
.na{border:1.5px solid var(--rule);background:none;border-radius:999px;padding:2px 12px;font-size:12px;color:var(--muted)}
.na.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.sumrow{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--rule)}
.sumrow:first-of-type{border-top:0}
.sumrow b{font-size:20px;min-width:44px;text-align:right}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--paper);border-top:1px solid var(--rule);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.bar .wrap{display:flex;gap:10px;align-items:center}
.prog{flex:1;font-size:12.5px;color:var(--muted);min-width:0}
.prog div{height:6px;background:var(--paper2);border-radius:3px;margin-top:5px;overflow:hidden}
.prog div i{display:block;height:100%;background:var(--pen);border-radius:3px;transition:width .25s}

/* ── ผลประเมิน ── */
table.r{width:100%;border-collapse:collapse;font-size:14px}
table.r th,table.r td{padding:8px 12px;border-top:1px solid var(--rule);text-align:left;vertical-align:top}
table.r th{font-weight:500;color:var(--muted);font-size:12px}
table.r td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.sc{font-weight:700}
.sc.b1{color:var(--bad)}.sc.b2{color:var(--mid)}.sc.b3{color:var(--good)}
.meter{height:8px;background:var(--paper2);border-radius:4px;min-width:80px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:4px}
details.ev{border-top:1px solid var(--rule)}
details.ev summary{padding:12px 16px;cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none}
details.ev summary::-webkit-details-marker{display:none}
details.ev .body{padding:0 16px 16px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;z-index:50;max-width:90vw;box-shadow:0 8px 28px rgba(30,10,60,.3)}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.be{display:block;min-height:18px;margin-top:3px}

/* ── โลโก้และสมองโปร่งใส ── */
.logo{display:block;flex:none}
.login .logo{width:96px;height:96px;margin-bottom:16px;filter:drop-shadow(0 12px 28px rgba(10,0,30,.45))}
.login .logo.anim .pulse{stroke-dasharray:260;stroke-dashoffset:260;animation:trace 1.4s ease-out .3s forwards}
@media (prefers-reduced-motion:reduce){.login .logo.anim .pulse{animation:none;stroke-dashoffset:0}}
.bgbrain{position:absolute;left:50%;top:40%;width:min(118vw,680px);transform:translate(-50%,-50%) rotate(-6deg);color:#c9b2f7;opacity:.17;pointer-events:none}
.login>*:not(.bgbrain){position:relative;z-index:1}
header.top .logo{width:36px;height:36px;position:relative}
</style>
</head>

<script>
/* ═══════════ ตั้งค่า: ใส่ URL ของ Apps Script Web app (ลงท้าย /exec) ═══════════ */
/* URL ของ Apps Script อยู่ในไฟล์ config.js (แก้ครั้งเดียว อัปเดต index.html ครั้งต่อไปไม่ต้องแก้อีก)
   ถ้าไม่มี config.js ใส่ URL ในบรรทัด INLINE_API แทนได้ */
const INLINE_API = 'https://script.google.com/macros/s/AKfycbwfVKN4V2FKyznqtTQ7bXguWIPUXnRDPcwXv6MtvbsnyJnGtOFnqeHK0xigTYfDkPPcOg/exec';

function thDate(iso){
  if(!iso) return '-';

}

}

/* ═══════════ เชื่อมต่อเซิร์ฟเวอร์ (มี retry + timeout) ═══════════ */
async function api(action, data = {}, { retries = 2, timeout = 25000 } = {}){
  if (!apiReady()) throw Object.assign(new Error('ระบบยังไม่พร้อมใช้งาน กรุณาติดต่อผู้ดูแลระบบ'), { server:true });
  for (let i = 0; i <= retries; i++){
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), timeout);
    let text;
    try {
      // text/plain = ไม่มี CORS preflight → ใช้ได้บนมือถือ/LINE browser
      const r = await fetch(S.api, { method:'POST', redirect:'follow', cache:'no-store', signal:ctl.signal,
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action, token:S.token }, data)) });
      text = await r.text();
    } catch(e){
      clearTimeout(tm); setNet('bad');
      if (i < retries) { await sleep(1000 * Math.pow(3, i)); continue; }
      throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
    }
    clearTimeout(tm);
    let j;
    try { j = JSON.parse(text); }
    catch(e){ setNet('bad'); throw Object.assign(new Error('เซิร์ฟเวอร์ไม่ได้ตอบเป็น JSON — ตรวจว่า Deploy แบบ “Anyone” และใช้ URL ที่ลงท้าย /exec'), { server:true }); }
    setNet('ok'); S.lastPing = Date.now();
    if (!j.ok){
      if (j.error === 'AUTH'){ logout(true); throw Object.assign(new Error('หมดเวลาเข้าระบบ กรุณาใส่รหัสใหม่'), { server:true }); }
      throw Object.assign(new Error(j.error || 'เกิดข้อผิดพลาด'), { server:true });
    }
    return j;
  }
}

function setNet(s){ S.net = s; const el = document.querySelector('.net'); if (el) el.className = 'net ' + s; }

/* ═══════════ กันหลับ: ping ทุก 5 นาที + ปลุกทันทีเมื่อกลับมาที่แอป ═══════════ */
async function heartbeat(force){
  if (!apiReady()) return;
  if (!force && Date.now() - S.lastPing < 20000) return;
  try {
    setNet('wait');
    const j = await api('ping', {}, { retries:1, timeout:15000 });
    if (S.token && !j.role){ logout(true); toast('หมดเวลาเข้าระบบ กรุณาใส่รหัสใหม่'); return; }
    await flushQueue();
  } catch(e){ /* สถานะจะแสดงเป็นจุดแดง */ }
}
setInterval(() => heartbeat(true), 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ heartbeat(); keepScreen(); } });
window.addEventListener('online', () => heartbeat(true));
window.addEventListener('offline', () => setNet('bad'));
window.addEventListener('pageshow', e => { if (e.persisted) heartbeat(true); });

// ไม่ให้หน้าจอดับระหว่างกรอกแบบประเมิน (Screen Wake Lock)
let wake = null;
async function keepScreen(){
  if (!LS.get('wake', true) || !S.current || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
  try { wake = await navigator.wakeLock.request('screen'); } catch(e){}
}
function releaseScreen(){ try { wake && wake.release(); } catch(e){} wake = null; }

/* ═══════════ คิวออฟไลน์: ส่งไม่ได้ → เก็บไว้ ส่งใหม่อัตโนมัติ ═══════════ */
const getQueue = () => LS.get('queue', []);
async function flushQueue(){
  const q = getQueue(); if (!q.length || !S.token) return;
  const keep = [];
  for (const ev of q){
    try { await api('submit', { ev }, { retries:0 }); LS.del('draft_' + ev.residentId); }
    catch(e){ if (e.server && !/หมดเวลา/.test(e.message)) toast('ส่งรายการค้างไม่ได้: ' + e.message, 5000); else keep.push(ev); }
  }
  LS.set('queue', keep);
  if (q.length !== keep.length){ toast(`ส่งรายการที่ค้างไว้แล้ว ${q.length - keep.length} รายการ`); if (!S.current) render(); }
}

async function pressKey(k){
  if (S.busy) return;
  if (k === 'C') S.pin = ''; else if (k === 'B') S.pin = S.pin.slice(0, -1); else if (S.pin.length < 6) S.pin += k;
  renderLogin();
  if (S.pin.length === 6){
    S.busy = true; renderLogin('กำลังตรวจสอบ…');
    try {
      const j = await api('login', { pin: S.pin });
      applyBoot(j); S.token = j.token; S.role = j.role; S.name = j.name || ''; S.code = j.code || ''; LS.set('token', j.token); LS.set('role', j.role); LS.set('name', S.name); LS.set('code', S.code);
      S.pin = ''; S.busy = false; S.tab = 'eval';
      render(); flushQueue(); openPendingTask();
    } catch(e){ S.pin = ''; S.busy = false; renderLogin(e.message); }
  }
}

const initial = n => (String(n).replace(/^(นพ\.|พญ\.|นาย|นางสาว|นาง|ดร\.)\s*/, '').trim()[0] || '?');

/* ─── แบบประเมิน (ทีละหมวด) ─── */
function draftOf(id){
  const me = LS.get('me', {});
  return LS.get('draft_' + id, { scores:{}, comment:'', evaluatorName: S.name && S.name !== 'ผู้ดูแลหลัก' ? S.name : (me.name || ''), evaluatorRole: me.role || (S.code ? 'อาจารย์' : '') });
}
const LAST = SECTIONS.length; // ขั้นสุดท้าย = สรุปและความคิดเห็น
function secMean(sec, d){ const v = sec.items.map(i => d.scores[i[0]]).filter(x => typeof x === 'number'); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }
function viewForm(){
  const r = S.current, d = draftOf(r.id), k = S.sec || 0;
  const steps = SECTIONS.map((s, i) => `<button class="step ${i === k ? 'on' : ''} ${s.items.every(it => d.scores[it[0]] !== undefined) ? 'done' : ''}" data-step="${i}"><span>${i + 1}</span>${s.th}</button>`).join('')
    + `<button class="step ${k === LAST ? 'on' : ''}" data-step="${LAST}"><span>✓</span>สรุปและส่ง</button>`;
  let body;
  if (k < LAST){
    const sec = SECTIONS[k];
    body = `<div class="sechead"><h2>${sec.th}</h2><p>${sec.en} · ${sec.items.length} ข้อ</p></div>
    ${sec.items.map(([key, th, en], i) => `
    <div class="item" data-item="${key}" role="group" aria-label="${esc(th)}">
      <div class="q"><span class="qn">${i + 1}</span><div class="tx">${th}<small>${en}</small></div>${valHtml(d.scores[key])}</div>
      <div class="gauge">${[1,2,3,4,5,6,7,8,9].map(n => segHtml(n, d.scores[key])).join('')}</div>
      <div class="gfoot"><div class="gl" aria-hidden="true"><span class="l1">Unsatisfactory</span><span class="l2">Satisfactory</span><span class="l3">Superior</span></div>
      <button class="na ${d.scores[key] === 'NA' ? 'on' : ''}" data-score="NA" aria-pressed="${d.scores[key] === 'NA'}">N/A</button></div>
    </div>`).join('')}`;
  } else {
    body = `<div class="sechead"><h2>สรุปและส่ง</h2><p>ตรวจคะแนนเฉลี่ยแต่ละหมวด แล้วเขียนความคิดเห็น</p></div>
    <section class="sheet" style="padding:6px 0">${SECTIONS.map((s, i) => { const m = secMean(s, d);
      return `<div class="sumrow"><div class="grow"><div>${s.th}</div><div class="meter"><i style="width:${m ? m / 9 * 100 : 0}%;background:var(--${m == null ? 'rule' : ['', 'bad', 'mid', 'good'][band(m)]})"></i></div></div><b class="sc ${m == null ? '' : 'b' + band(m)}">${m == null ? '–' : m.toFixed(1)}</b><button class="btn ghost" data-step="${i}">แก้</button></div>`; }).join('')}</section>
    <section class="sheet"><h2>ความคิดเห็น <span>ไม่บังคับ</span></h2>
      <div class="pad"><textarea class="t" id="evComment" data-d="comment" placeholder="จุดเด่น และสิ่งที่ควรพัฒนา">${esc(d.comment)}</textarea></div></section>`;
  }
  return `
  <div class="who">
    <div class="row"><button class="btn" data-act="back">‹ รายชื่อ</button><span class="grow"></span><span class="svc ${esc(r.service)}">${esc(r.service)}</span></div>
    <div class="nm" style="margin-top:12px">${esc(r.name)}</div>
    <div class="muted small">ช่วงประเมิน ${period(r)}</div>
    ${r._aid ? `<div class="tag" style="display:inline-block;margin-top:6px">งานที่แอดมินส่งให้ ${esc(r._staff || '')}</div>` : ''}
    ${k === 0 || k === LAST || !d.evaluatorName || !d.evaluatorRole ? `
    <label class="f" for="evName">ชื่อผู้ประเมิน</label>
    <input id="evName" class="t" data-d="evaluatorName" value="${esc(d.evaluatorName)}" autocomplete="name">
    <label class="f">ผู้ประเมินเป็น</label>
    <div class="chips" id="roles">${ROLES.map(x => `<button class="chip ${d.evaluatorRole === x ? 'on' : ''}" data-role="${esc(x)}">${x}</button>`).join('')}</div>`
    : `<div class="small muted" style="margin-top:8px">ผู้ประเมิน: ${esc(d.evaluatorName)} (${esc(d.evaluatorRole)})</div>`}
  </div>
  <div class="steps" role="tablist">${steps}</div>
  ${body}`;
}
const segHtml = (n, v) => { const f = typeof v === 'number' && n <= v;
  return `<button class="seg${f ? ' f b' + band(v) : ''}${n === v ? ' cur' : ''}" data-score="${n}" aria-pressed="${n === v}" aria-label="${n} ${bandName(n)}">${n}</button>`; };
const valHtml = v => v === undefined ? '<output class="val">–<small>ยังไม่ให้</small></output>'
  : v === 'NA' ? '<output class="val na">N/A<small>ไม่ได้สังเกต</small></output>'
  : `<output class="val b${band(v)}">${v}<small>${bandName(v)}</small></output>`;
function paintItem(item, v){
  item.querySelectorAll('.seg').forEach(b => b.outerHTML = segHtml(Number(b.dataset.score), v));
  item.querySelector('.val').outerHTML = valHtml(v);
  const na = item.querySelector('.na'); na.classList.toggle('on', v === 'NA'); na.setAttribute('aria-pressed', v === 'NA');
  item.classList.remove('miss');
}
function formBar(){
  const k = S.sec || 0;
  return `<div class="bar"><div class="wrap">
    ${k > 0 ? '<button class="btn" data-act="prev" aria-label="ก่อนหน้า">‹</button>' : ''}
    <div class="prog"><span id="progTxt"></span><div><i id="progBar" style="width:0"></i></div></div>
    ${k < LAST ? '<button class="btn pri" data-act="next">ถัดไป ›</button>' : '<button class="btn pri" data-act="submit" id="submitBtn">ส่งแบบประเมิน</button>'}
  </div></div>`;
}
function saveDraft(mut){
  const id = S.current.id, d = draftOf(id); mut(d); LS.set('draft_' + id, d);
  LS.set('me', { name: d.evaluatorName, role: d.evaluatorRole }); return d;
}
function updateProgress(){
  const d = draftOf(S.current.id), done = ITEMS.filter(i => d.scores[i[0]] !== undefined).length;
  document.getElementById('progTxt').textContent = `ให้คะแนนแล้ว ${done} จาก ${ITEMS.length} ข้อ`;
  document.getElementById('progBar').style.width = (done / ITEMS.length * 100) + '%';
  SECTIONS.forEach((s, i) => document.querySelector(`.step[data-step="${i}"]`)?.classList.toggle('done', s.items.every(it => d.scores[it[0]] !== undefined)));
}
function goStep(k){ S.sec = Math.max(0, Math.min(LAST, k)); render(); window.scrollTo(0, 0);
  document.querySelector('.step.on')?.scrollIntoView({ inline:'center', block:'nearest' }); }
async function submitForm(){
  const r = S.current, d = draftOf(r.id);
  const miss = ITEMS.filter(i => d.scores[i[0]] === undefined);
  if (!d.evaluatorName.trim()){ toast('กรุณาใส่ชื่อผู้ประเมิน'); document.getElementById('evName')?.focus(); return; }
  if (!d.evaluatorRole){ toast('กรุณาเลือกว่าผู้ประเมินเป็นใคร'); return; }
  if (miss.length){
    const secIdx = SECTIONS.findIndex(s => s.items.some(it => it[0] === miss[0][0]));
    goStep(secIdx);
    miss.forEach(i => document.querySelector(`[data-item="${i[0]}"]`)?.classList.add('miss'));
    document.querySelector(`[data-item="${miss[0][0]}"]`)?.scrollIntoView({ behavior:'smooth', block:'center' });
    toast(`ยังไม่ได้ให้คะแนน ${miss.length} ข้อ (เลือก N/A ได้ถ้าไม่ได้สังเกต)`); return;
  }
  const ev = { id: d.id || uid(), residentId: r.id, assignmentId: r._aid || '', evaluatorName: d.evaluatorName, evaluatorRole: d.evaluatorRole, scores: d.scores, comment: d.comment };
  saveDraft(x => x.id = ev.id);
  const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.textContent = 'กำลังส่ง…';
  try {
    const j = await api('submit', { ev });
    LS.del('draft_' + r.id); if (r._aid) S.tasks = S.tasks.filter(x => x.id !== r._aid); S.current = null; S.sec = 0; releaseScreen(); render(); window.scrollTo(0, 0);
    toast(`ส่งแบบประเมินแล้ว · เฉลี่ยรวม ${j.avgOverall ?? '-'}`);
  } catch(e){
    if (e.server){ btn.disabled = false; btn.textContent = 'ส่งแบบประเมิน'; toast(e.message, 5000); return; }
    const q = getQueue().filter(x => x.id !== ev.id); q.push(ev); LS.set('queue', q);
    S.current = null; S.sec = 0; releaseScreen(); render();
    toast('ยังเชื่อมต่อไม่ได้ — เก็บแบบประเมินไว้ในเครื่องแล้ว จะส่งให้อัตโนมัติ', 5000);
  }
}

/* ─── แท็บ: ผลประเมิน (ผู้ดูแล) ─── */
function viewResults(){
  if (!S.evals) return `<div class="empty">กำลังโหลดผลประเมิน…</div>`;
  const groups = {};
  S.evals.forEach(e => (groups[e.residentId] ||= { name:e.residentName, service:e.service, start:e.start, end:e.end, list:[] }).list.push(e));
  const ids = Object.keys(groups);
  const sel = S.resFilter && groups[S.resFilter] ? S.resFilter : '';
  const evs = (sel ? groups[sel].list : S.evals).slice().sort((a, b) => String(b.timestamp).localeCompare(String(a.timestamp)));
  const num = v => typeof v === 'number' ? v : (v === '' || v === 'N/A' || v == null ? null : Number(v));
  const mean = arr => { const v = arr.map(num).filter(x => x != null && !isNaN(x)); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const sc = v => v == null ? '<span class="muted">-</span>' : `<span class="sc b${band(v)}">${v.toFixed(2)}</span>`;

  let summary = '';
  if (sel){
    const L = groups[sel].list;
    summary = `<section class="sheet"><h2>${esc(groups[sel].name)} <span>${esc(groups[sel].service)} · ${period(groups[sel])} · ${L.length} ผู้ประเมิน</span></h2>
    <div class="scroll"><table class="r"><tr><th>หัวข้อ</th><th style="text-align:right">เฉลี่ย</th><th></th></tr>
    ${SECTIONS.map(sec => `<tr><td colspan="3" style="font-weight:600;background:var(--paper2)">${sec.th} · เฉลี่ย ${sc(mean(L.map(e => e[sec.key])))}</td></tr>` +
      sec.items.map(([k, th]) => { const m = mean(L.map(e => e[k]));
        return `<tr><td>${th}</td><td class="n">${sc(m)}</td><td style="width:30%"><div class="meter"><i style="width:${m ? m / 9 * 100 : 0}%;background:var(--${m == null ? 'rule' : ['', 'bad', 'mid', 'good'][band(m)]})"></i></div></td></tr>`; }).join('')).join('')}
    <tr><td style="font-weight:700">เฉลี่ยรวม</td><td class="n">${sc(mean(L.map(e => e.avgOverall)))}</td><td></td></tr></table></div></section>`;
  }
  return `
  <div class="row" style="margin-bottom:12px">
    <select class="t grow" id="resFilter" style="flex:1"><option value="">ทุกคน (${S.evals.length} แบบประเมิน)</option>
      ${ids.map(id => `<option value="${esc(id)}" ${id === sel ? 'selected' : ''}>${esc(groups[id].name)} · ${esc(groups[id].service)} · ${thDate(groups[id].start)} (${groups[id].list.length})</option>`).join('')}
    </select>
    <button class="btn" data-act="reloadEvals">รีเฟรช</button>${S.role === 'admin' ? '<button class="btn" data-act="csv">ส่งออก CSV</button>' : ''}
  </div>
  ${summary}
  ${!sel && ids.length ? `<section class="sheet"><h2>สรุปรายบุคคล</h2><div class="scroll"><table class="r">
    <tr><th>แพทย์</th><th>สาย</th><th style="text-align:right">จำนวน</th><th style="text-align:right">เฉลี่ยรวม</th></tr>
    ${ids.map(id => `<tr><td><button class="btn" style="padding:2px 8px" data-pick="${esc(id)}">${esc(groups[id].name)}</button><div class="muted small">${period(groups[id])}</div></td><td>${esc(groups[id].service)}</td><td class="n">${groups[id].list.length}</td><td class="n">${sc(mean(groups[id].list.map(e => e.avgOverall)))}</td></tr>`).join('')}
  </table></div></section>` : ''}
  <section class="sheet"><h2>รายการแบบประเมิน</h2>
  ${evs.length ? evs.map(e => `
    <details class="ev"><summary><span class="grow"><b>${esc(e.residentName)}</b> <span class="muted small">โดย ${esc(e.evaluatorName)} (${esc(e.evaluatorRole)}) · ${thDateTime(e.timestamp)}</span></span>${sc(num(e.avgOverall))}</summary>
      <div class="body"><div class="scroll"><table class="r">
        ${SECTIONS.map(sec => `<tr><td colspan="2" style="font-weight:600;background:var(--paper2)">${sec.th}</td><td class="n" style="background:var(--paper2)">${sc(num(e[sec.key]))}</td></tr>` + sec.items.map(([k, th], i) => `<tr><td class="muted">${i + 1}</td><td>${th}</td><td class="n">${e[k] === 'N/A' ? 'N/A' : sc(num(e[k])).replace('.00', '')}</td></tr>`).join('')).join('')}
      </table></div>
      ${e.comment ? `<p><b>ความคิดเห็น:</b> ${esc(e.comment)}</p>` : ''}
      ${S.role === 'admin' ? `<button class="btn danger" data-delev="${esc(e.id)}">ลบแบบประเมินนี้</button>` : ''}</div>
    </details>`).join('') : '<div class="empty">ยังไม่มีผลประเมิน</div>'}
  </section>`;
}
function exportCsv(){
  if (!S.evals || !S.evals.length) return toast('ยังไม่มีข้อมูลให้ส่งออก');
  const keys = Object.keys(S.evals[0]);
  const head = keys.map(k => LABEL[k] ? `${k} ${LABEL[k]}` : k);
  const rows = [head].concat(S.evals.map(e => keys.map(k => e[k])));
  const csv = rows.map(r => r.map(c => { const s = String(c ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8' }));
  a.download = `neuro-evaluations-${today()}.csv`; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function assignTags(rid){
  const L = (S.assigns || []).filter(a => a.residentId === String(rid)); if (!L.length) return '';
  const done = L.filter(a => a.status === 'ประเมินแล้ว').length, wait = L.length - done;
  return (wait ? `<span class="tag d">รอประเมิน ${wait}</span>` : '') + (done ? `<span class="tag">ประเมินแล้ว ${done}</span>` : '');
}

/* ═══════════ events ═══════════ */
app.addEventListener('click', async ev => {
  const t = ev.target.closest('button'); if (!t) return;
  const d = t.dataset;
  try {
    if (d.key) return pressKey(d.key);
    if (d.tab){
      S.tab = d.tab; render();
      if (d.tab === 'results'){ await loadEvals(); if (S.tab === 'results' && !S.current) render(); }
      if (d.tab === 'settings' && S.role === 'admin'){ S.status = await api('status'); render(); }
      if (d.tab === 'staff'){ S.staff = (await api('staff')).staff || []; render(); }
      if (d.tab === 'residents'){ await loadAssigns(); render(); }
      return;
    }
    if (d.open){ S.current = S.residents.find(r => String(r.id) === d.open); S.sec = 0; render(); window.scrollTo(0, 0); keepScreen(); return; }
    if (d.score){
      const item = t.closest('.item'), k = item.dataset.item, cur = draftOf(S.current.id).scores[k];
      const val = d.score === 'NA' ? (cur === 'NA' ? undefined : 'NA') : Number(d.score);
      saveDraft(x => { if (val === undefined) delete x.scores[k]; else x.scores[k] = val; });
      paintItem(item, val); updateProgress(); return;
    }
    if (d.step !== undefined){ goStep(Number(d.step)); return; }
    if (d.role){ saveDraft(x => x.evaluatorRole = d.role); t.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === t)); return; }
    if (d.yearf !== undefined){ S.yearFilter = d.yearf; LS.set('yearFilter', d.yearf); render(); return; }
    if (d.pinw){ t.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === t)); return; }
    if (d.yedit){ S.editYear = Object.assign({}, S.years.find(x => String(x.id) === d.yedit)); render(); return; }
    if (d.ydel){
      const y = S.years.find(x => String(x.id) === d.ydel), n = S.residents.filter(r => String(r.year) === d.ydel).length;
      if (!confirm(`ลบปีการศึกษา ${y.name}?` + (n ? `\nรายชื่อ ${n} คนในปีนี้จะยังอยู่ แต่จะไม่ระบุปี` : ''))) return;
      await api('deleteYear', { id:d.ydel }); if (String(S.yearFilter) === d.ydel){ S.yearFilter = null; LS.del('yearFilter'); }
      await loadResidents(); render(); toast('ลบปีการศึกษาแล้ว'); return;
    }
    if (d.srole){ t.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === t)); if (!S.editStaff || !S.editStaff.origCode) document.getElementById('sNotify').checked = d.srole === 'แอดมิน'; return; }
    if (d.sedit){ const x = S.staff.find(y => y.code === d.sedit); S.editStaff = Object.assign({ origCode:x.code }, x); S.pinFor = null; render(); window.scrollTo(0, 0); return; }
    if (d.spin){ S.pinFor = S.pinFor === d.spin ? null : d.spin; render(); document.getElementById('sPin')?.focus(); return; }
    if (d.sunlink){ const x = S.staff.find(y => y.code === d.sunlink); if (!confirm(`ยกเลิกการเชื่อม LINE ของ ${x.name}?\nเจ้าตัวพิมพ์รหัสบุคคลใน LINE OA เพื่อเชื่อมใหม่ได้`)) return;
      await api('unlinkLine', { code:d.sunlink }); await reloadStaff(); render(); toast('ยกเลิกการเชื่อม LINE แล้ว'); return; }
    if (d.sdel){ const x = S.staff.find(y => y.code === d.sdel); if (!confirm(`ลบ ${x.name} (${x.code}) ออกจากบุคลากร?\nรหัสส่วนตัวและการเชื่อม LINE จะถูกลบด้วย`)) return;
      await api('deleteStaff', { code:d.sdel }); await reloadStaff(); render(); toast('ลบบุคลากรแล้ว'); return; }
    if (d.task){ const t2 = S.tasks.find(x => x.id === d.task); if (t2) openTask(t2); return; }
    if (d.assign){
      S.assignFor = S.assignFor === d.assign ? null : d.assign; render();
      if (S.assignFor){ const jobs = []; if (S.staff === null) jobs.push(api('staff').then(j => S.staff = j.staff || [])); if (S.assigns === null) jobs.push(loadAssigns()); if (jobs.length){ await Promise.all(jobs); render(); } }
      document.getElementById('aStart')?.scrollIntoView({ block:'center' }); return;
    }
    if (d.remind){ t.disabled = true; const j = await api('remind', { id:d.remind, appUrl:appUrl() }); await loadAssigns(); render(); toast('ส่งเตือน ' + j.reminded + ' แล้ว'); return; }
    if (d.uncancel){ if (!confirm('ยกเลิกงานประเมินนี้?')) return; await api('cancelAssign', { id:d.uncancel }); await loadAssigns(); render(); toast('ยกเลิกแล้ว'); return; }
    if (d.svc){ t.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === t)); return; }
    if (d.pick){ S.resFilter = d.pick; render(); window.scrollTo(0, 0); return; }
    if (d.edit){ S.editing = Object.assign({}, S.residents.find(r => String(r.id) === d.edit)); render(); window.scrollTo(0, 0); return; }
    if (d.copy){ const r = S.residents.find(x => String(x.id) === d.copy); S.editing = { name:r.name, service:r.service, start:'', end:'', active:true, note:r.note || '', year:r.year || '' }; render(); window.scrollTo(0, 0); document.getElementById('rStart').focus(); return; }
    if (d.delres){
      const r = S.residents.find(x => String(x.id) === d.delres);
      if (!confirm(`ลบ “${r.name}” (${r.service}) ออกจากรายชื่อ?\nผลประเมินที่ส่งแล้วจะยังอยู่`)) return;
      await api('deleteResident', { id:d.delres }); await loadResidents(); render(); toast('ลบรายชื่อแล้ว'); return;
    }
    if (d.delev){
      if (!confirm('ลบแบบประเมินนี้ถาวร?')) return;
      await api('deleteEvaluation', { id:d.delev }); await loadEvals(); render(); toast('ลบแบบประเมินแล้ว'); return;
    }
    switch (d.act){
      case 'ping': S.lastPing = 0; await heartbeat(true); toast(S.net === 'ok' ? 'เชื่อมต่อได้ปกติ' : 'ยังเชื่อมต่อไม่ได้'); if (S.token && !S.current) render(); return;
      case 'flush': await flushQueue(); render(); return;
      case 'reload': await loadResidents(); render(); toast('อัปเดตรายชื่อแล้ว'); return;
      case 'reloadEvals': await loadEvals(); render(); return;
      case 'csv': return exportCsv();
      case 'back': S.current = null; S.sec = 0; releaseScreen(); render(); return;
      case 'next': return goStep((S.sec || 0) + 1);
      case 'prev': return goStep((S.sec || 0) - 1);
      case 'submit': return submitForm();
      case 'saveRes': {
        const r = readResForm();
        if (!r.name) return toast('กรุณาใส่ชื่อแพทย์');
        if (!r.start || !r.end || r.start > r.end) return toast('กรุณาเลือกวันเริ่มและวันสิ้นสุดให้ถูกต้อง');
        t.disabled = true;
        await api('saveResident', { resident:r }); S.editing = null; await loadResidents(); render();
        toast(r.id ? 'บันทึกการแก้ไขแล้ว' : 'เพิ่มรายชื่อแล้ว'); return;
      }
      case 'cancelRes': S.editing = null; render(); return;
      case 'cancelYear': S.editYear = null; render(); return;
      case 'cancelStaff': S.editStaff = null; render(); return;
      case 'closeAssign': S.assignFor = null; render(); return;
      case 'sendAssign': {
        const codes = [...document.querySelectorAll('#aList input:checked')].map(x => x.value);
        const start = document.getElementById('aStart').value, end = document.getElementById('aEnd').value;
        if (!codes.length) return toast('กรุณาเลือกอาจารย์อย่างน้อย 1 ท่าน');
        if (!start || !end || start > end) return toast('กรุณาใส่ช่วงวันที่ให้ถูกต้อง');
        t.disabled = true; t.textContent = 'กำลังส่ง…';
        const j = await api('assign', { residentId:S.assignFor, start, end, codes, appUrl:appUrl() }, { timeout:60000 });
        await loadAssigns(); render();
        toast([j.sent.length ? `ส่ง LINE แล้ว ${j.sent.length} ท่าน` : '', j.noLine.length ? `ไม่มี LINE ${j.noLine.length} ท่าน (${j.noLine.join(', ')}) — ท่านจะเห็นงานในแอปเมื่อเข้าด้วยรหัสส่วนตัว` : '', j.skipped.length ? `ส่งไปแล้วก่อนหน้า: ${j.skipped.join(', ')}` : ''].filter(Boolean).join(' · ') || 'ไม่มีรายการใหม่', 7000);
        return;
      }
      case 'cancelPin': S.pinFor = null; render(); return;
      case 'saveStaff': {
        const x = { origCode: S.editStaff && S.editStaff.origCode || '', code: document.getElementById('sCode').value.trim(), name: document.getElementById('sName').value.trim(),
          email: document.getElementById('sEmail').value.trim(), role: document.querySelector('#sRole .chip.on')?.dataset.srole || 'ผู้ประเมิน', notify: document.getElementById('sNotify').checked };
        if (!x.code) return toast('กรุณาใส่รหัสบุคคล'); if (!x.name) return toast('กรุณาใส่ชื่อ-นามสกุล');
        t.disabled = true; await api('saveStaff', { staff:x }); S.editStaff = null; await reloadStaff(); render();
        toast(x.origCode ? 'บันทึกแล้ว' : `เพิ่ม ${x.name} แล้ว` + (x.role === 'แอดมิน' ? ' — กด “ตั้งรหัส” เพื่อให้เข้าแอปในฐานะแอดมิน' : ''), 5000); return;
      }
      case 'saveStaffPin': {
        const v = document.getElementById('sPin').value;
        if (!/^\d{6}$/.test(v)) return toast('รหัสต้องเป็นตัวเลข 6 หลัก');
        t.disabled = true; await api('staffPin', { code:S.pinFor, pin:v }); const nm = S.staff.find(y => y.code === S.pinFor).name;
        S.pinFor = null; await reloadStaff(); render(); toast(`ตั้งรหัสให้ ${nm} แล้ว — แจ้งรหัสให้เจ้าตัวทางช่องทางส่วนตัว`, 5000); return;
      }
      case 'clearStaffPin': if (!confirm('ลบรหัสส่วนตัวของคนนี้?')) return; await api('staffPin', { code:S.pinFor, pin:'' }); S.pinFor = null; await reloadStaff(); render(); toast('ลบรหัสแล้ว'); return;
      case 'saveLine': {
        const tok = document.getElementById('lineTok').value.trim(), to = document.getElementById('lineTo').value.trim();
        t.disabled = true; await api('setLine', Object.assign({ to }, tok ? { token:tok } : {})); S.status = await api('status'); render(); toast('บันทึกการตั้งค่า LINE แล้ว'); return;
      }
      case 'saveYear': {
        const y = Object.assign({}, S.editYear || {}, { name: document.getElementById('yName').value.trim(), start: document.getElementById('yStart').value, end: document.getElementById('yEnd').value });
        if (!y.name) return toast('กรุณาใส่ชื่อปีการศึกษา เช่น 2569');
        if (!y.start || !y.end || y.start > y.end) return toast('กรุณาเลือกวันเริ่มและวันสิ้นสุดให้ถูกต้อง');
        t.disabled = true;
        const j = await api('saveYear', { year:y }); S.editYear = null;
        if (!y.id){ S.yearFilter = j.id; LS.set('yearFilter', j.id); }
        await loadResidents(); render(); toast(y.id ? 'บันทึกปีการศึกษาแล้ว' : `เพิ่มปีการศึกษา ${y.name} แล้ว`); return;
      }
      case 'changePin': {
        const which = document.querySelector('#pinWhich .chip.on')?.dataset.pinw || (S.code ? 'self' : 'admin');
        const cur = document.getElementById('pinCur').value, n1 = document.getElementById('pinNew').value, n2 = document.getElementById('pinNew2').value;
        if (!/^\d{6}$/.test(cur)) return toast('ใส่รหัสปัจจุบันของคุณ 6 หลัก');
        if (!/^\d{6}$/.test(n1)) return toast('รหัสใหม่ต้องเป็นตัวเลข 6 หลัก');
        if (n1 !== n2) return toast('รหัสใหม่ทั้งสองช่องไม่ตรงกัน');
        if (!confirm(`ยืนยันเปลี่ยน${which === 'eval' ? 'รหัสผู้ประเมิน (ร่วม)' : which === 'self' ? 'รหัสส่วนตัวของคุณ' : 'รหัสผู้ดูแลหลัก'}?`)) return;
        t.disabled = true;
        await api('changePin', { which, current:cur, newPin:n1 });
        ['pinCur','pinNew','pinNew2'].forEach(id => document.getElementById(id).value = '');
        t.disabled = false;
        toast(which === 'eval' ? 'เปลี่ยนรหัสผู้ประเมินแล้ว — อย่าลืมแจ้งรหัสใหม่' : 'เปลี่ยนรหัสแล้ว ครั้งหน้าใช้รหัสใหม่', 5000); return;
      }
      case 'testLine': { const j = await api('testLine'); toast(j.sent ? `ส่งข้อความทดสอบแล้ว (${j.sent} ปลายทาง)` : 'ส่งไม่สำเร็จ: ' + (j.reason || (j.errors || []).join(' ')), 6000); return; }
      case 'backup': { t.disabled = true; t.textContent = 'กำลังสำรอง…'; const j = await api('backupNow', {}, { timeout:90000, retries:0 }); toast('สำรองข้อมูลแล้ว: ' + j.backup); S.status = await api('status'); render(); return; }
      case 'logout': if (confirm('ออกจากระบบ?')) logout(); return;
    }
  } catch(e){ toast(e.message, 5000); if (t.isConnected) t.disabled = false; }
});
app.addEventListener('input', ev => {
  const t = ev.target;
  if (t.type === 'date'){ const b = document.getElementById(t.id + '_be'); if (b) b.textContent = t.value ? '= ' + thDate(t.value) : '';
    if (t.id === 'yStart' && t.value && !document.getElementById('yName').value) document.getElementById('yName').value = String(Number(t.value.slice(0, 4)) - (Number(t.value.slice(5, 7)) < 7 ? 1 : 0) + 543); }
  if (t.id === 'yName' && /^25\d\d$/.test(t.value.trim())){ // พิมพ์ปี พ.ศ. → เติม 1 ก.ค. – 30 ก.ย. ปีถัดไป ให้อัตโนมัติ
    const ce = Number(t.value.trim()) - 543;
    [['yStart', ce + '-07-01'], ['yEnd', (ce + 1) + '-09-30']].forEach(([id, v]) => { const el = document.getElementById(id); el.value = v; document.getElementById(id + '_be').textContent = '= ' + thDate(v); });
  }
  if (/^pin/.test(t.id) || t.id === 'sPin') t.value = t.value.replace(/\D/g, '').slice(0, 6);
  if (t.id === 'search'){ S.filter = t.value; document.getElementById('reslist').innerHTML = listItems(); }
  if (t.dataset.d && S.current) saveDraft(x => x[t.dataset.d] = t.value);
});
app.addEventListener('change', ev => {
  if (ev.target.id === 'resFilter'){ S.resFilter = ev.target.value; render(); }
  if (ev.target.id === 'wakeChk'){ LS.set('wake', ev.target.checked); }
  if (ev.target.id === 'rYear'){
    const y = S.years.find(x => String(x.id) === ev.target.value);
    if (y){ [['rStart', y.start], ['rEnd', y.end]].forEach(([id, v]) => { const el = document.getElementById(id); el.value = v; document.getElementById(id + '_be').textContent = '= ' + thDate(v); }); }
  }
});
document.addEventListener('keydown', e => {
  if (S.token || document.activeElement?.tagName === 'INPUT') return;
  if (/^\d$/.test(e.key)) pressKey(e.key); else if (e.key === 'Backspace') pressKey('B');
});

/* ═══════════ start ═══════════ */
(async function start(){
  if (!S.token) { renderLogin(); heartbeat(true); return; }
  // เปิดทันทีจากข้อมูลที่จำไว้ แล้วค่อยอัปเดตจากเซิร์ฟเวอร์เบื้องหลัง
  const cached = LS.get('boot', null);
  if (cached){ S.residents = cached.residents || []; S.years = cached.years || []; S.tasks = cached.tasks || []; render(); }
  else app.innerHTML = '<div class="empty" style="padding-top:40vh">กำลังเชื่อมต่อ…</div>';
  try { await loadResidents(); S.lastPing = Date.now(); if (!S.current) render(); flushQueue(); openPendingTask(); }
  catch(e){ if (S.token) { render(); toast(e.message, 5000); } }
})();
</script>
</body>
</html>
